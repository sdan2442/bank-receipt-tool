      电子商业承兑汇票: 7
      票据号码: 2
      票据状态: 2
      出票人信息: 3
      承兑人信息: 3
      承兑人承兑: 2
      汇票到期日: 2
      票据金额: 2
      票据行为人详细信息: 2
      增信信息: 1
  acceptance_bill_endorsement:
