version: 7
common:
  primary_date_keywords:
    - 交易时间
  date_keywords:
    - 交易日
    - 交易日期
    - 付款日期
    - 记账日期
    - 转账日期
    - 业务日期
    - 交易时间
    - 记账时间
  payer_keywords:
    - 付款人名称
    - 付款账号户名
    - 汇款人名称
    - 转出户名
    - 付款单位
    - 付款户名
    - 付款人
    - 付款方
    - 汇款人
  payer_institution_review:
    # 付款人若像银行/开户行，通常意味着 OCR 取到了相邻的开户银行字段。
    # “银行”只按名称结尾判断，避免误伤“银行设备科技有限公司”等普通企业。
    keywords:
      - 支行
      - 分行
      - 营业部
      - 信用社
      - 农商行
      - 村镇银行
      - 农村商业银行
      - 信用合作联社
    suffixes:
      - 银行
      - 银行股份有限公司
      - 银行有限责任公司
      - 信用合作联社
  payee_keywords:
    - 收款人名称
    - 收款账号户名
    - 收款户名
    - 收款单位
    - 收款人
    - 收款方
  amount_keywords:
    - 交易金额
    - 付款金额
    - 转账金额
    - 汇款金额
    - 人民币金额
    - 小写金额
    - 借方发生额
    - 金额
  amount_exclude_keywords:
    - 余额
    - 手续费
    - 服务费
    - 账号
    - 流水号
    - 序号
    - 可用余额
  date_patterns:
    - '(?<!\d)(20\d{2})[-/.年](0?[1-9]|1[0-2])[-/.月](0?[1-9]|[12]\d|3[01])日?(?:\s+[0-2]?\d:[0-5]\d(?::[0-5]\d)?)?'
    - '(?<!\d)(20\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(?!\d)'
  amount_pattern: '(?<!\d)(?:人民币\s*)?[¥￥]?\s*((?:\d{1,3}(?:,\d{3})+)|\d+)(?:\.(\d{1,2}))?(?!\d)'
  spatial:
    same_line_bonus: 0.12
    right_of_keyword_bonus: 0.12
    next_line_bonus: 0.06
    max_vertical_gap_px: 110
    max_horizontal_gap_px: 900
banks: {}

