      交易对方名字: 2
      电子回单: 5
      业务回单: 5
      银行回单: 4
      网上银行电子回单: 5
      交易流水号: 2
      交易时间: 2
      交易日期: 1
      付款人: 2
      付款户名: 2
      收款人: 1
      金额小写: 2
      交易金额: 2
  acceptance_bill:
